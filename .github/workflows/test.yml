name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
  RUST_BACKTRACE: '1'
  # Legacy bridge tests mutate shared static FFI fixtures; internal concurrency tests still run.
  RUST_TEST_THREADS: '1'

jobs:
  test:
    name: Windows x64 / formal bridge
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - name: Fetch locked dependencies for offline tests
        run: cargo fetch --locked
      - name: Verify docs and formal bridge workspace contracts
        run: ./.github/scripts/run-tests.ps1
      - name: Test capability tooling
        run: node --test scripts/check-snowcat-coverage.test.mjs scripts/extract-snowcat-capabilities.test.mjs scripts/analyze-text-send-trace.test.mjs
