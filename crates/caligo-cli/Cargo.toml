[package]
name = "caligo-cli"
version.workspace = true
edition.workspace = true
default-run = "caligo-cli"

[features]
default = []
research = ["caligo-bridge/research", "caligo-core/research"]

[dependencies]
caligo-model = { workspace = true }
caligo-core = { workspace = true }
caligo-bridge = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
windows-sys = { workspace = true }
iced-x86 = { version = "1.21.0", features = ["decoder"] }
